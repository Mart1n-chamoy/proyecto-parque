server {
    listen 80;
    server_name comercialsl.com www.comercialsl.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name comercialsl.com www.comercialsl.com;
    ssl_certificate /etc/letsencrypt/live/comercialsl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comercialsl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }
    location /media/ {
        alias /var/www/media/;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }
}

server {
    listen 80;
    server_name n8n.comercialsl.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name n8n.comercialsl.com;
    ssl_certificate /etc/letsencrypt/live/n8n.comercialsl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.comercialsl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}
